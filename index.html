<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101113" />
    <meta
      name="description"
      content="Yuhang Jin — UX Design & Human–AI Interaction. A collection of work on creative collaboration, intelligent experiences and personal explorations."
    />
    <title>YUHANG JIN</title>
    <link rel="stylesheet" href="./loading.css" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script type="module" crossorigin src="./assets/index-CF3Jzj0v.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BrUYypQL.css">
  </head>
  <body>
    <div
      id="portfolio-loader"
      role="region"
      aria-label="Loading portfolio"
      aria-busy="true"
    >
      <header>
        <p class="loader-name">YUHANG JIN</p>
        <span class="loader-edition">A PERSONAL COLLECTION · 2026</span>
      </header>
      <div class="loader-content">
        <div
          class="loader-progress"
          role="progressbar"
          aria-label="Loading progress"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <span></span>
        </div>
        <div class="loader-meta" role="status">
          <span class="loader-status">PREPARING THE COLLECTION</span
          ><span class="loader-step">01 / 03</span>
        </div>
      </div>
      <footer class="loader-footer">
        <div class="loader-actions" hidden>
          <button class="loader-retry" type="button">TRY AGAIN ↗</button>
          <button class="loader-back" type="button">BACK TO COLLECTION</button>
        </div>
      </footer>
    </div>
    <main id="app" tabindex="-1"></main>
    <noscript
      ><style>#portfolio-loader{display:none}</style
      >Please enable JavaScript to explore this portfolio.</noscript
    >
  </body>
</html>
